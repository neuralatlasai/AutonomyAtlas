name: Publish the online monograph

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'book/**'
      - 'bibliography/**'
      - 'config/**'
      - 'monograph.tex'
      - 'index.md'
      - 'BOOK.md'
      - 'publication_format.md'
      - 'output/pdf/agentic_state_monograph.pdf'
      - 'output/source/agentic_state_source.zip'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'book/**'
      - 'bibliography/**'
      - 'config/**'
      - 'monograph.tex'
      - 'index.md'
      - 'BOOK.md'
      - 'publication_format.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out the public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install the locked dependencies
        run: npm ci
      - name: Check TypeScript and Astro
        run: npm run check
      - name: Audit accepted-source coverage and data freshness
        run: node scripts/check-content.mjs
      - name: Build the static edition
        run: npm run build
      - name: Check published links, anchors, assets, and file boundaries
        run: node scripts/check-content.mjs --dist
      - name: Upload only the checked static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
